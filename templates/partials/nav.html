<div class="modal fade" id="calculatorModal" tabindex="-1" aria-labelledby="calculatorModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 320px">
    <div class="modal-content shadow">
      <div class="modal-header bg-success text-white py-2">
        <h5 class="modal-title fs-6" id="calculatorModalLabel"><i class="bi bi-calculator me-1"></i> Rekenmachine</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Sluiten"></button>
      </div>
      <div class="modal-body p-3">
        <input
          type="text"
          id="calcDisplay"
          class="form-control form-control-lg text-end mb-3 bg-white"
          readonly
          value="0"
        />
        <div class="d-grid gap-2" style="grid-template-columns: repeat(4, 1fr); display: grid">
          <button type="button" class="btn btn-outline-danger btn-sm" onclick="calcClear()">C</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="calcAppend('(')">(</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="calcAppend(')')">)</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="calcAppend('/')">÷</button>

          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('7')">7</button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('8')">8</button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('9')">9</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="calcAppend('*')">×</button>

          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('4')">4</button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('5')">5</button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('6')">6</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="calcAppend('-')">-</button>

          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('1')">1</button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('2')">2</button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('3')">3</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="calcAppend('+')">+</button>

          <button
            type="button"
            class="btn btn-outline-dark btn-sm col-span-2"
            style="grid-column: span 2"
            onclick="calcAppend('0')"
          >
            0
          </button>
          <button type="button" class="btn btn-outline-dark btn-sm" onclick="calcAppend('.')">.</button>
          <button type="button" class="btn btn-success btn-sm" onclick="calcCalculate()">=</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/calculator.js"></script>
