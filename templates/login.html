<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Inloggen - Budgetapp Scouts Sint-Joris{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card sk-card p-4 shadow-sm">
            <div class="text-center mb-4">
              <div
                class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                style="width: 60px; height: 60px; font-size: 1.5rem"
              >
                <i class="bi bi-shield-lock-fill"></i>
              </div>
              <h1 class="h4 fw-bold text-success mb-1"><i class="bi bi-currency-euro me-1"></i>Budgetapp</h1>
              <p class="text-muted small mb-0">Scouts Sint-Joris</p>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i>
              {% if error == "1" %} Onjuist wachtwoord. Probeer het opnieuw. {% else %} {{ error }} {% endif %}
              <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            <form method="post" action="/login">
              <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-secondary">Wachtwoord</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-key"></i>
                  </span>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control border-start-0 ps-0"
                    placeholder="Voer het wachtwoord in"
                    required
                    autofocus
                  />
                </div>
              </div>
              <button type="submit" class="btn sk-btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Inloggen
              </button>
            </form>
          </div>
          <div class="text-center mt-3 text-muted small">&copy; Scouts Sint-Joris</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
